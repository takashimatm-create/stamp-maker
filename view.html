<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>LINEスタンプの確認</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f6fa;color:#172b4d;margin:0;padding:20px}main{max-width:1400px;margin:auto;background:white;padding:20px;border-radius:16px}h1{font-size:22px}p{line-height:1.8}img{width:100%;height:auto}button{background:#1763d3;color:white;border:0;border-radius:8px;padding:12px;font:inherit}a{color:#1763d3}</style></head><body><main><h1>LINEスタンプの確認</h1><p>画像を拡大して、顔・文字・ポーズをご確認ください。修正のご希望や承認のお返事は、リンクを送った方のLINEへお願いします。</p><p id="status" role="status">画像を読み込み中…</p><img id="image" alt="確認用の16コマ一覧画像" hidden><p><button id="retry" hidden>もう一度読み込む</button></p><p>このリンクは作成から30日間有効です。リンクを知っている方が閲覧できます。</p></main><script type="module">
const id=location.hash.slice(1),image=document.getElementById('image'),status=document.getElementById('status'),retry=document.getElementById('retry');let url;
async function load(){if(!/^[a-f0-9]{32}$/.test(id)){status.textContent='共有リンクを確認してください。';return;}retry.hidden=true;status.textContent='画像を読み込み中…';try{const r=await fetch('https://stamp-maker-api.takashima-tm.workers.dev/shared/'+id,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error(r.status===404?'有効期限が切れたか、画像がまだ反映されていません。作成直後の場合は少し待って読み込み直してください。':'画像を読み込めませんでした。');const blob=await r.blob();if(blob.type!=='image/png')throw Error('画像の形式を確認できません。');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);image.src=url;image.hidden=false;status.textContent='';}catch(e){status.textContent=e.message;retry.hidden=false;}}
retry.onclick=load;load();
</script></body></html>
